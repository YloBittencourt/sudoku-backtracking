name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-c:
    name: Build & Run C Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C program
        run: |
          cd core
          make
      - name: Test C program execution
        run: |
          cd core
          printf "1\n" | ./sudoku

  test-web:
    name: Test JavaScript Solver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test

